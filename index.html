function Tilt({className="",children}){
  const ref=useRef();
  const mv=e=>{const el=ref.current,b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height,s=el.style;
    s.setProperty("--ry",((x-.5)*12).toFixed(2)+"deg");s.setProperty("--rx",((.5-y)*12).toFixed(2)+"deg");
    s.setProperty("--gx",(x*100)+"%");s.setProperty("--gy",(y*100)+"%");s.setProperty("--lit",1)};
  const lv=()=>{const s=ref.current.style;s.setProperty("--rx","0deg");s.setProperty("--ry","0deg");s.setProperty("--lit",0)};
  return h("div",{ref,className:"glass tilt "+className,onPointerMove:mv,onPointerLeave:lv},children);
}

function Player({o,i,onClose}){
  const ref=useRef();
  useEffect(()=>{
    const r=document.documentElement,prev=document.body.style.overflow;

  },[]);

    h('div',{className:'glass',role:'dialog','aria-modal':'true','aria-label':o.t,onClick:e=>e.stopPropagation()},

function Hero(){
  return h("section",{id:"home",className:"hero"},
    h("div",null,
      h("h1",null,"Gaween"),
      h("p",{className:"lead"},"Full-stack developer and digital marketer. I build ",h("b",null,"web products")," and the content that gets them seen."),
      h("div",{className:"row"},
        h("a",{className:"btn main",href:"#videos"},"Watch my videos"),
        h("a",{className:"btn",href:"#contact"},"Get in touch"))),
    h("div",{className:"stack"},
      h("span",{className:"chip",style:{top:0,right:"6%","--d":-34}},"Next.js"),
      h("span",{className:"chip",style:{top:"46%",left:"-2%","--d":-52}},"MERN"),
      h("span",{className:"chip",style:{bottom:0,left:"18%","--d":-28}},"Veo 3"),
      h("div",{className:"plane"},
        h("div",{className:"halo"}),h("div",{className:"ring"}),h("div",{className:"glass ph"},h("div",{className:"phin"},h("img",{src:PHOTO,alt:"Portrait of Gaween",width:640,height:800,decoding:"async"}))),
        h("div",{className:"glass pnl p2"},h("div",{className:"k"},"Shipping now"),h("div",{className:"big"},"Aviation Voice forum site"),h("div",{className:"meter"},h("i"))),
        h("div",{className:"glass pnl p3"},h("div",{className:"big"},"Gavik"),h("div",{className:"k"},"Freelance studio · Gampaha, Sri Lanka"),h("div",{style:{marginTop:10}},h("span",{className:"dot"}),"Open for projects")))));
}

function Stack(){
  return h("section",{id:"stack"},
    h("h2",null,"What I work with"),
    h("p",{className:"sub"},"Code, camera and campaigns, all under one roof."),
    h("div",{className:"skills"},Object.entries(STACK).map(([k,v])=>
      h(Tilt,{key:k},h("div",{style:{padding:28}},h("h3",null,k),h("div",{className:"pills"},v.map(x=>h("span",{className:"pill",key:x},x))))))));
}

function Contact(){
  const links=[["Email",CONFIG.email&&"mailto:"+CONFIG.email],["WhatsApp",CONFIG.whatsapp&&"https://wa.me/"+CONFIG.whatsapp],["LinkedIn",CONFIG.linkedin],["GitHub",CONFIG.github]].filter(l=>l[1]);
  return h("section",{id:"contact"},
    h(Tilt,{className:"contact"},
      h("h2",null,"Have a project in mind?"),
      h("p",{className:"sub",style:{margin:"0 auto"}},"I take on websites, web apps and content campaigns from Sri Lanka, for clients anywhere."),
      h("div",{className:"row"},links.length?links.map((l,i)=>h("a",{key:l[0],className:"btn"+(i?"":" main"),href:l[1],target:"_blank",rel:"noopener"},l[0])):h("span",{className:"pill"},"Gampaha, Sri Lanka"))),
    h("footer",null,"© 2026 Gavik. Built with React."));
}

function Dock(){
  const [act,setAct]=useState("home");
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&setAct(e.target.id)),{rootMargin:"-45% 0px -50% 0px"});
    NAV.forEach(([id])=>{const el=document.getElementById(id);el&&io.observe(el)});
    return()=>io.disconnect();
  },[]);
  return h("nav",{className:"glass dock","aria-label":"Sections"},NAV.map(([id,l])=>h("a",{key:id,href:"#"+id,className:act===id?"act":""},l)));
}

function App(){
  const lens=useRef();
  useEffect(()=>{
    if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    const r=document.documentElement,L=lens.current;
    let tx=0,ty=0,nx=0,ny=0,px=innerWidth/2,py=innerHeight/2,lx=px,ly=py,s=1,big=false,last=-1e5,raf;
    const mv=e=>{px=e.clientX;py=e.clientY;tx=(px/innerWidth-.5)*2;ty=(py/innerHeight-.5)*2;last=performance.now();L.classList.add("on");r.classList.add("cc")};
    const ov=e=>{big=!!(e.target.closest&&e.target.closest("a,.tilt,.pill"))};
    addEventListener("pointermove",mv,{passive:true});addEventListener("pointerover",ov,{passive:true});document.documentElement.addEventListener("mouseleave",()=>L.classList.remove("on"));
    const loop=t=>{
      if(t-last>3500){tx=Math.sin(t/4200)*.7;ty=Math.cos(t/5300)*.5}
      nx+=(tx-nx)*.06;ny+=(ty-ny)*.06;lx+=(px-lx)*.4;ly+=(py-ly)*.4;s+=((big?2.2:1)-s)*.2;
      r.style.setProperty("--nx",nx.toFixed(3));r.style.setProperty("--ny",ny.toFixed(3));
      L.style.transform="translate3d("+lx.toFixed(1)+"px,"+ly.toFixed(1)+"px,0) translate(-50%,-50%) scale("+s.toFixed(3)+")";
      raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);removeEventListener("pointermove",mv);removeEventListener("pointerover",ov)};
  },[]);
  return h(React.Fragment,null,
    h("div",{className:"stage","aria-hidden":"true"},
      h("div",{className:"orb",style:{width:520,height:520,left:"-8%",top:"4%",background:"radial-gradient(circle,#7b6bff,transparent 70%)","--d":-70}}),
      h("div",{className:"orb",style:{width:480,height:480,right:"-6%",top:"28%",background:"radial-gradient(circle,#ff6ad5,transparent 70%)","--d":55}}),
      h("div",{className:"orb",style:{width:420,height:420,left:"34%",bottom:"-10%",background:"radial-gradient(circle,#5de4ff,transparent 70%)","--d":-40}}),
      h("div",{className:"floor"})),
    h("main",null,h(Hero),h(Services),h(Videos),h(Stack),h(Contact)),
    h(Dock),
    h("div",{className:"lens",ref:lens,"aria-hidden":"true"}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
